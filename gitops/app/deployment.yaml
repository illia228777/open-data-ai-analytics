apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: analytics
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: illiamatsko/analytics-web:latest
          ports:
            - containerPort: 8000