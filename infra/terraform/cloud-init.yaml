#cloud-config
package_update: true

packages:
  - docker.io
  - docker-compose-v2
  - git

write_files:
  - path: /home/ubuntu/.env_analytics
    content: |
      POSTGRES_DB=analytics
      POSTGRES_USER=analytics
      POSTGRES_PASSWORD=changeme
      POSTGRES_HOST=db
      POSTGRES_PORT=5432

runcmd:
  - systemctl start docker
  - systemctl enable docker
  - usermod -aG docker ubuntu
  - git clone https://github.com/illia228777/open-data-ai-analytics.git /home/ubuntu/open-data-ai-analytics
  - cp /home/ubuntu/.env_analytics /home/ubuntu/open-data-ai-analytics/.env
  - chown -R ubuntu:ubuntu /home/ubuntu/open-data-ai-analytics
  - cd /home/ubuntu/open-data-ai-analytics && docker compose up -d
  - cd /home/ubuntu/open-data-ai-analytics/monitoring && docker compose -f docker-compose.monitoring.yml up -d