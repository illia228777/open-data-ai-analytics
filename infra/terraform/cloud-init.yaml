#cloud-config
package_update: true

packages:
  - docker.io
  - docker-compose-v2
  - git

runcmd:
  - systemctl start docker
  - systemctl enable docker
  - usermod -aG docker ubuntu
  - cd /home/ubuntu && git clone https://github.com/illia228777/open-data-ai-analytics.git
  - cd /home/ubuntu/open-data-ai-analytics && docker compose up -d
