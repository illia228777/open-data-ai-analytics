[project]
name = "open-data-ai-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "polars>=1.20.0",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/analytics",
    "src/data_load",
    "src/data_quality",
    "src/data_research",
    "src/visualization",
    "src/web",
    "src/utils",
]
